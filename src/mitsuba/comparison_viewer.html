<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>VI-RT vs Mitsuba 3 — Comparação</title>
<style>
/* Paleta: fundo de laboratório escuro, acentos em âmbar técnico */
:root {
  --bg:        #0d0f12;
  --surface:   #161a20;
  --border:    #252b34;
  --amber:     #f0a500;
  --amber-dim: #8a5f00;
  --text:      #d4d8de;
  --text-dim:  #6a7280;
  --good:      #3ecf8e;
  --warn:      #f0a500;
  --bad:       #e55353;
  --font-mono: "JetBrains Mono", "Fira Code", "Courier New", monospace;
  --font-body: "Inter", system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
}

/* ── Header ── */
header {
  border-bottom: 1px solid var(--border);
  padding: 20px 32px;
  display: flex;
  align-items: baseline;
  gap: 16px;
}
header h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--amber);
  font-family: var(--font-mono);
}
header .sub {
  font-size: 12px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}

/* ── Layout ── */
.layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 61px); }

/* ── Sidebar ── */
aside {
  border-right: 1px solid var(--border);
  padding: 16px 0;
  overflow-y: auto;
}
.sidebar-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 8px 16px 4px;
}
.scene-btn {
  display: block;
  width: 100%;
  padding: 9px 16px;
  text-align: left;
  background: none;
  border: none;
  border-left: 3px solid transparent;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
.scene-btn:hover { color: var(--text); background: var(--surface); }
.scene-btn.active {
  color: var(--amber);
  border-left-color: var(--amber);
  background: #1a1e26;
}
.badge {
  float: right;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 20px;
  background: var(--border);
  color: var(--text-dim);
}
.badge.good { background: #0d2e1e; color: var(--good); }
.badge.warn { background: #2a1f00; color: var(--warn); }
.badge.bad  { background: #2a0f0f; color: var(--bad); }

/* ── Main content ── */
main { padding: 24px 28px; overflow-y: auto; }

.metrics-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.metric-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 18px;
}
.metric-card .label {
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.metric-card .value {
  font-size: 28px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--amber);
  line-height: 1;
}
.metric-card .unit {
  font-size: 12px;
  color: var(--text-dim);
  margin-left: 4px;
}
.metric-card .interp {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 6px;
}

/* ── Viewer ── */
.viewer-tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.tab-btn {
  padding: 7px 14px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-family: var(--font-mono);
  cursor: pointer;
  transition: all .15s;
  margin-bottom: -1px;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--amber); border-bottom-color: var(--amber); }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Slider de comparação */
.slider-wrap {
  position: relative;
  display: inline-block;
  cursor: col-resize;
  user-select: none;
  max-width: 100%;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.slider-wrap img {
  display: block;
  max-width: 100%;
  height: auto;
}
.slider-overlay {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
}
.slider-overlay img {
  position: absolute;
  top: 0; left: 0;
  max-width: none;
}
.slider-line {
  position: absolute;
  top: 0;
  width: 2px;
  height: 100%;
  background: var(--amber);
  pointer-events: none;
}
.slider-handle {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--amber);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  font-weight: 900;
  color: #000;
  box-shadow: 0 2px 8px rgba(0,0,0,.5);
}
.slider-label {
  position: absolute;
  bottom: 8px;
  font-size: 10px;
  letter-spacing: .8px;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 3px;
  background: rgba(0,0,0,.6);
  color: #fff;
  pointer-events: none;
}
.slider-label.left  { left: 8px; }
.slider-label.right { right: 8px; }

/* Diff & full images */
.img-frame {
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  display: inline-block;
  max-width: 100%;
}
.img-frame img { display: block; max-width: 100%; }

/* Placeholder */
.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 320px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  gap: 10px;
}
.placeholder .icon { font-size: 40px; }
.placeholder code {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg);
  padding: 8px 14px;
  border-radius: 4px;
  color: var(--amber);
}

/* Tabela de métricas */
.metrics-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 12px;
  margin-top: 16px;
}
.metrics-table th {
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.metrics-table td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
}
.metrics-table tr:hover td { background: var(--surface); }
.metrics-table .val-good { color: var(--good); }
.metrics-table .val-warn { color: var(--warn); }
.metrics-table .val-bad  { color: var(--bad); }

/* Load overlay */
#load-overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
  z-index: 999;
}
#load-overlay .spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--amber);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="load-overlay">
  <div class="spinner"></div>
  <span style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim)">A carregar relatório…</span>
</div>

<header>
  <h1>VI-RT ↔ Mitsuba 3</h1>
  <span class="sub">Comparação de renders por cena</span>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="sidebar-label">Cenas</div>
    <!-- injectado via JS -->
  </aside>

  <main id="main-content">
    <div class="placeholder">
      <div class="icon">🎬</div>
      <span>Selecciona uma cena na barra lateral</span>
    </div>
  </main>
</div>

<script>
// ── Utilitários ────────────────────────────────────────────────────────────

function rmse_class(v) {
  if (v < 0.02)  return "good";
  if (v < 0.06)  return "warn";
  return "bad";
}
function psnr_class(v) {
  if (v > 30) return "good";
  if (v > 20) return "warn";
  return "bad";
}
function ssim_class(v) {
  if (isNaN(v)) return "";
  if (v > 0.9)  return "good";
  if (v > 0.7)  return "warn";
  return "bad";
}
function fmt2(v) { return isNaN(v) ? "—" : v.toFixed(4); }
function fmt1(v) { return isNaN(v) ? "—" : v.toFixed(1); }

// ── Slider de comparação ──────────────────────────────────────────────────

function makeSlider(viSrc, miSrc) {
  const wrap = document.createElement("div");
  wrap.className = "slider-wrap";

  const bgImg = document.createElement("img");
  bgImg.src = miSrc; bgImg.alt = "Mitsuba";
  wrap.appendChild(bgImg);

  const overlay = document.createElement("div");
  overlay.className = "slider-overlay";
  const topImg = document.createElement("img");
  topImg.src = viSrc; topImg.alt = "VI-RT";
  overlay.appendChild(topImg);
  wrap.appendChild(overlay);

  const line   = document.createElement("div"); line.className = "slider-line";
  const handle = document.createElement("div"); handle.className = "slider-handle"; handle.textContent = "◀▶";
  wrap.appendChild(line); wrap.appendChild(handle);

  const lblL = document.createElement("div"); lblL.className = "slider-label left";  lblL.textContent = "VI-RT";
  const lblR = document.createElement("div"); lblR.className = "slider-label right"; lblR.textContent = "Mitsuba 3";
  wrap.appendChild(lblL); wrap.appendChild(lblR);

  let pct = 50;

  function applyPct(p) {
    pct = Math.max(0, Math.min(100, p));
    const W = wrap.offsetWidth;
    const x = W * pct / 100;
    overlay.style.width     = x + "px";
    topImg.style.width      = W + "px";
    line.style.left         = x + "px";
    handle.style.left       = x + "px";
  }

  bgImg.onload = () => applyPct(pct);

  function onMove(clientX) {
    const rect = wrap.getBoundingClientRect();
    applyPct((clientX - rect.left) / rect.width * 100);
  }

  let dragging = false;
  wrap.addEventListener("mousedown",  e => { dragging = true; onMove(e.clientX); });
  window.addEventListener("mousemove", e => { if (dragging) onMove(e.clientX); });
  window.addEventListener("mouseup",   () => { dragging = false; });
  wrap.addEventListener("touchstart",  e => { dragging = true; onMove(e.touches[0].clientX); }, {passive:true});
  window.addEventListener("touchmove", e => { if (dragging) onMove(e.touches[0].clientX); }, {passive:true});
  window.addEventListener("touchend",  () => { dragging = false; });

  return wrap;
}

// ── Renderização da cena ──────────────────────────────────────────────────

let currentTab = "slider";

function renderScene(scene) {
  const mc = document.getElementById("main-content");

  const viSrc  = scene.vi_rt_png  ? `comparison_output/${scene.vi_rt_png}` : null;
  const miSrc  = scene.mitsuba_png ? `comparison_output/${scene.mitsuba_png}` : null;
  const cmpSrc = scene.comparison  ? `comparison_output/${scene.comparison}` : null;
  const dfSrc  = scene.diff        ? `comparison_output/${scene.diff}` : null;

  const metrics = { rmse: scene.rmse, psnr: scene.psnr, ssim: scene.ssim };

  mc.innerHTML = `
    <div class="metrics-row">
      <div class="metric-card">
        <div class="label">RMSE</div>
        <div class="value ${rmse_class(metrics.rmse)}">${fmt2(metrics.rmse)}<span class="unit"></span></div>
        <div class="interp">${metrics.rmse < 0.02 ? "Excelente concordância" : metrics.rmse < 0.06 ? "Boa concordância" : "Diferença visível"}</div>
      </div>
      <div class="metric-card">
        <div class="label">PSNR</div>
        <div class="value ${psnr_class(metrics.psnr)}">${fmt1(metrics.psnr)}<span class="unit">dB</span></div>
        <div class="interp">${metrics.psnr > 30 ? "> 30 dB: qualidade alta" : metrics.psnr > 20 ? "20–30 dB: aceitável" : "< 20 dB: diferenças claras"}</div>
      </div>
      <div class="metric-card">
        <div class="label">SSIM</div>
        <div class="value ${ssim_class(metrics.ssim)}">${fmt2(metrics.ssim)}</div>
        <div class="interp">${isNaN(metrics.ssim) ? "Instala scikit-image" : metrics.ssim > 0.9 ? "Estrutura muito semelhante" : "Diferenças estruturais"}</div>
      </div>
    </div>

    <div class="viewer-tabs" id="tabs">
      <button class="tab-btn ${currentTab==='slider'?'active':''}" data-tab="slider">◀▶ Slider</button>
      <button class="tab-btn ${currentTab==='side'  ?'active':''}" data-tab="side">  ⊟ Lado a lado</button>
      <button class="tab-btn ${currentTab==='diff'  ?'active':''}" data-tab="diff">  ⚡ Diferença</button>
    </div>

    <div id="panel-slider" class="tab-panel ${currentTab==='slider'?'active':''}">
      ${viSrc && miSrc ? '<div id="slider-mount"></div>' : `<div class="placeholder"><div class="icon">🖼</div><span>Imagens não encontradas</span><code>./render_all.sh</code></div>`}
    </div>

    <div id="panel-side" class="tab-panel ${currentTab==='side'?'active':''}">
      ${cmpSrc ? `<div class="img-frame"><img src="${cmpSrc}" alt="Comparação lado a lado"/></div>` : `<div class="placeholder"><div class="icon">🖼</div><span>Imagem de comparação não encontrada</span><code>python3 compare_renders.py</code></div>`}
    </div>

    <div id="panel-diff" class="tab-panel ${currentTab==='diff'?'active':''}">
      ${dfSrc ? `<div class="img-frame"><img src="${dfSrc}" alt="Mapa de diferença"/></div>
        <p style="margin-top:8px;font-size:11px;color:var(--text-dim)">Azul = erro baixo &nbsp;·&nbsp; Vermelho = erro alto &nbsp;·&nbsp; Factor de amplificação ×5</p>` : `<div class="placeholder"><div class="icon">📊</div><span>Mapa de diferença não encontrado</span><code>python3 compare_renders.py</code></div>`}
    </div>
  `;

  // Montar slider
  if (viSrc && miSrc) {
    document.getElementById("slider-mount").appendChild(makeSlider(viSrc, miSrc));
  }

  // Tabs
  document.getElementById("tabs").addEventListener("click", e => {
    const btn = e.target.closest(".tab-btn");
    if (!btn) return;
    currentTab = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === `panel-${currentTab}`));
  });
}

// ── Tabela geral de métricas ───────────────────────────────────────────────

function renderAllMetrics(scenes) {
  const mc = document.getElementById("main-content");
  let rows = scenes.map(s => `
    <tr>
      <td>${s.scene}</td>
      <td class="${rmse_class(s.rmse)} val-${rmse_class(s.rmse)}">${fmt2(s.rmse)}</td>
      <td class="val-${psnr_class(s.psnr)}">${fmt1(s.psnr)} dB</td>
      <td class="val-${ssim_class(s.ssim)}">${fmt2(s.ssim)}</td>
    </tr>
  `).join("");

  mc.innerHTML = `
    <h2 style="font-family:var(--font-mono);font-size:14px;color:var(--amber);margin-bottom:8px">Resumo de métricas — todas as cenas</h2>
    <table class="metrics-table">
      <thead><tr><th>Cena</th><th>RMSE ↓</th><th>PSNR ↑</th><th>SSIM ↑</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p style="margin-top:16px;font-size:11px;color:var(--text-dim)">
      RMSE: quanto menor melhor &nbsp;·&nbsp; PSNR: quanto maior melhor (> 30 dB = bom) &nbsp;·&nbsp; SSIM: 0→1 (1 = idêntico)
    </p>
  `;
}

// ── Bootstrap ─────────────────────────────────────────────────────────────

async function init() {
  let report;

  try {
    const res = await fetch("comparison_output/report.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    report = await res.json();
  } catch(e) {
    // Demo: dados de exemplo para quando não há report.json
    report = {
      title: "VI-RT vs Mitsuba 3 — Demo (sem report.json)",
      scenes: [
        { scene: "phong_spheres",  rmse: 0.0312, psnr: 30.1, ssim: 0.921,
          vi_rt_png: null, mitsuba_png: null, comparison: null, diff: null },
        { scene: "cook_torrance",  rmse: 0.0489, psnr: 26.2, ssim: 0.874,
          vi_rt_png: null, mitsuba_png: null, comparison: null, diff: null },
        { scene: "oren_nayar",    rmse: 0.0156, psnr: 36.1, ssim: 0.963,
          vi_rt_png: null, mitsuba_png: null, comparison: null, diff: null },
        { scene: "ward",          rmse: 0.0721, psnr: 22.8, ssim: 0.811,
          vi_rt_png: null, mitsuba_png: null, comparison: null, diff: null },
        { scene: "ashikhmin",     rmse: 0.0234, psnr: 32.6, ssim: 0.942,
          vi_rt_png: null, mitsuba_png: null, comparison: null, diff: null },
        { scene: "disney",        rmse: 0.0418, psnr: 27.6, ssim: 0.899,
          vi_rt_png: null, mitsuba_png: null, comparison: null, diff: null },
      ]
    };
    console.warn("report.json não encontrado — a usar dados de demo:", e.message);
  }

  const sidebar = document.getElementById("sidebar");

  // Botão "Todas"
  const allBtn = document.createElement("button");
  allBtn.className = "scene-btn";
  allBtn.textContent = "📊 Resumo geral";
  allBtn.addEventListener("click", () => {
    document.querySelectorAll(".scene-btn").forEach(b => b.classList.remove("active"));
    allBtn.classList.add("active");
    renderAllMetrics(report.scenes);
  });
  sidebar.appendChild(allBtn);

  const sep = document.createElement("div");
  sep.className = "sidebar-label";
  sep.style.marginTop = "8px";
  sep.textContent = "Por cena";
  sidebar.appendChild(sep);

  report.scenes.forEach(scene => {
    const btn = document.createElement("button");
    btn.className = "scene-btn";
    const cls = rmse_class(scene.rmse);
    btn.innerHTML = `${scene.scene}<span class="badge ${cls}">${scene.rmse.toFixed(3)}</span>`;
    btn.addEventListener("click", () => {
      document.querySelectorAll(".scene-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderScene(scene);
    });
    sidebar.appendChild(btn);
  });

  document.getElementById("load-overlay").style.display = "none";

  // Seleccionar a primeira cena por omissão
  if (report.scenes.length > 0) {
    sidebar.querySelectorAll(".scene-btn")[1]?.click();
  }
}

init();
</script>
</body>
</html>
